<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goofy Duel</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1626; color: #fff; font-family: "Trebuchet MS", "Comic Sans MS", system-ui, sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { background: #87c5ff; image-rendering: auto; box-shadow: 0 10px 40px #0008; border-radius: 8px; cursor: crosshair; }
  #lobby { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #1b1626ee; z-index: 2; }
  #lobby .card { background: #2c2440; padding: 28px 32px; border-radius: 14px; width: min(420px, 90vw); box-shadow: 0 10px 40px #0009; }
  #lobby h1 { margin: 0 0 4px; font-size: 34px; letter-spacing: 1px; }
  #lobby p { margin: 0 0 18px; color: #c9bfe0; }
  #lobby label { display: block; font-size: 13px; color: #c9bfe0; margin: 10px 0 4px; }
  #lobby input { width: 100%; box-sizing: border-box; font: inherit; padding: 10px 12px; border-radius: 8px; border: 2px solid #4a3d6b; background: #1b1626; color: #fff; }
  #lobby button { margin-top: 18px; width: 100%; font: inherit; font-size: 20px; padding: 12px; border: 0; border-radius: 10px; background: #e0493e; color: #fff; cursor: pointer; }
  #lobby button:hover { background: #f05a4f; }
  #lobby .keys { margin-top: 16px; font-size: 13px; color: #a99fc4; line-height: 1.6; }
  kbd { background: #1b1626; border: 1px solid #4a3d6b; border-radius: 4px; padding: 1px 5px; font-size: 12px; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="1280" height="640"></canvas></div>
<div id="lobby">
  <div class="card">
    <h1>⚔️ Goofy Duel</h1>
    <p>Swing direction matters. Limbs are optional.</p>
    <label for="name">Your knightly name</label>
    <input id="name" maxlength="20" autocomplete="off">
    <label for="room">Arena (share this with your opponent)</label>
    <input id="room" maxlength="24" value="main" autocomplete="off">
    <button id="go">Enter the arena</button>
    <div class="keys">
      <kbd>A</kbd>/<kbd>D</kbd> move · <kbd>W</kbd>/<kbd>Space</kbd> jump<br>
      <b>Mouse up / level / down</b> picks overhead, thrust or low<br>
      <b>Left click</b> swing · <b>Right click</b> or <kbd>Shift</kbd> block (match their direction!)<br>
      Block during your own wind-up to feint · <kbd>B</kbd> add/remove a bot
    </div>
  </div>
</div>
<script type="module" src="/client.js"></script>
</body>
</html>
